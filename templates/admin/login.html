<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inicio de Sesión</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body {
      background-image: url("{{ url_for('static', filename='img/Imagen_frente.jpg') }}");
      background-repeat: no-repeat;
      background-position: center;
      background-attachment: fixed;
      background-size: cover;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Poppins", sans-serif;
    }

    .login-card {
      backdrop-filter: blur(12px);
      background: rgba(255, 255, 255, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.3);
      padding: 2.8rem 2.5rem;
      border-radius: 1.2rem;
      box-shadow: 0 8px 32px rgba(0,0,0,0.25);
      width: 100%;
      max-width: 390px;
      color: #fff;
      animation: fadeIn 1s ease;
    }

    @keyframes fadeIn {
      from {opacity: 0; transform: translateY(20px);}
      to {opacity: 1; transform: translateY(0);}
    }

    .login-title {
      text-align: center;
      font-weight: 700;
      margin-bottom: 1.5rem;
      letter-spacing: 0.5px;
      color: #fff;
    }

    .icon-wrapper {
      text-align: center;
      margin-bottom: 1rem;
    }

    .icon-wrapper i {
      font-size: 3rem;
      color: #fff;
      background: linear-gradient(135deg, #ff00b8, #7a00ff);
      padding: 15px;
      border-radius: 50%;
      box-shadow: 0 4px 15px rgba(255, 0, 200, 0.4);
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }

    .form-control {
      border-radius: 0.7rem;
      padding-left: 2.5rem;
      background: rgba(255, 255, 255, 0.85);
      border: none;
      color: #333;
      transition: all 0.3s ease;
    }

    .form-control:focus {
      box-shadow: 0 0 0 3px rgba(150, 0, 255, 0.3);
      background: #fff;
    }

    .form-group {
      position: relative;
      margin-bottom: 1.3rem;
    }

    .form-group i {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: #555;
    }

    .btn-login {
      background: linear-gradient(90deg, #ff00b8, #7a00ff);
      border: none;
      color: white;
      width: 100%;
      border-radius: 50px;
      font-weight: 600;
      padding: 0.8rem;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(122, 0, 255, 0.4);
    }

    .btn-login:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(122, 0, 255, 0.6);
      background: linear-gradient(90deg, #ff4fd6, #9a3fff);
    }

    .text-muted {
      color: rgba(255, 255, 255, 0.8) !important;
    }

    ::placeholder {
      color: #777 !important;
      opacity: 0.8;
    }
  </style>
</head>
<body>

  <div class="login-card">
    <div class="icon-wrapper">
      <i class="bi bi-person-circle"></i>
    </div>
    <h4 class="login-title">INICIO DE SESIÓN</h4>
    <form action="/admin/login" method="post">
      <div class="form-group">
        <i class="bi bi-person"></i>
        <input type="text" name="txtUsuario" class="form-control" placeholder="Nombre de usuario" required>
      </div>

      <div class="form-group">
        <i class="bi bi-lock"></i>
        <input type="password" name="txtPassword" class="form-control" placeholder="Contraseña" required>
      </div>

      <button type="submit" class="btn btn-login">Acceder</button>

      <p class="text-center mt-3 text-muted">© Casa Campestre Las Mercedes</p>
    </form>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
