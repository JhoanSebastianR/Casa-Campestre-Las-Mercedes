{% include 'sitio/cabecera.html' %}

<div class="reserva-exitosa">
  <style>
    .reserva-exitosa {
      background: #fff;
      font-family: "Poppins", sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 90vh;
      margin: 0;
    }

    .reserva-exitosa .exito-container {
      background: #ffffff;
      border: 2px solid #e6e6e6;
      border-radius: 20px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.1);
      padding: 50px;
      text-align: center;
      max-width: 480px;
      width: 90%;
      animation: fadeInUp 0.8s ease-out;
    }

    .reserva-exitosa .checkmark {
      font-size: 70px;
      color: #2ecc71;
      margin-bottom: 20px;
      animation: bounce 1.2s infinite ease-in-out;
    }

    .reserva-exitosa h2 {
      color: #2d3436;
      font-size: 1.8rem;
      margin-bottom: 10px;
    }

    .reserva-exitosa p {
      color: #636e72;
      font-size: 1.1rem;
      margin-bottom: 30px;
    }

    .reserva-exitosa .botones {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .reserva-exitosa .botones button {
      border: none;
      border-radius: 12px;
      padding: 14px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .reserva-exitosa .btn-factura {
      background-color: #2ecc71;
      color: white;
    }

    .reserva-exitosa .btn-factura:hover {
      background-color: #27ae60;
      transform: scale(1.05);
    }

    .reserva-exitosa .btn-inicio {
      background-color: #3498db;
      color: white;
    }

    .reserva-exitosa .btn-inicio:hover {
      background-color: #2980b9;
      transform: scale(1.05);
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(40px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }
  </style>

  <div class="exito-container">
    <div class="checkmark">✅</div>
    <h2>¡Reserva Exitosa!</h2>
    <p>Tu reserva ha sido registrada correctamente.<br>
    Puedes ver la factura o volver al inicio.</p>

    <div class="botones">
      <button class="btn-factura" onclick="window.location.href='/factura'">
        🧾 Ver Reserva
      </button>
      <button class="btn-inicio" onclick="window.location.href='/'">
        🏠 Volver al Inicio
      </button>
    </div>
  </div>
</div>
