{% include 'sitio/cabecera.html' %}
  

  <div class="reserva-page">
    <div class="container">
      <h2>Reserva tu estadía</h2>

      <!-- FORMULARIO -->
      <form id="formReserva">
       <label>Nombre:</label>
        <input type="text" name="nombre" required />

        <label>Apellido:</label>
        <input type="text" name="apellido" required />

        <label>Cédula:</label>
        <input type="text" name="cedula" required />

        <label>Correo electrónico:</label>
        <input type="email" name="correo" required />

        <label>Teléfono:</label>
        <input type="tel" name="telefono" required />

        <label>Dirección:</label>
        <input type="tel" name="direccion" required />

        <label>Fecha de ingreso:</label>
        <input type="date" name="fecha_ingreso" id="fecha_ingreso" required />

        <label>Fecha de salida:</label>
        <input type="date" name="fecha_salida" id="fecha_salida" required />

        <label>Hora de ingreso:</label>
        <select name="hora_ingreso" required>
          <option value="">Selecciona una hora</option>
          <option value="8:00 AM">8:00 AM</option>
          <option value="5:00 PM">5:00 PM</option>
        </select>

        <label>Hora de salida:</label>
        <select name="hora_salida" required>
          <option value="">Selecciona una hora</option>
          <option value="8:00 AM">8:00 AM</option>
          <option value="5:00 PM">5:00 PM</option>
        </select>

        <label>Número de personas (mínimo 10):</label>
        <input type="number" name="personas_mayores" min="10" required />

        <button type="submit">Continuar</button>
      </form>

      <!-- RESUMEN -->
      <div class="resumen" id="resumenReserva">
        <h3>Confirma tu reserva</h3>
        <table id="tablaResumen"></table>
        <div class="total" id="totalPagar"></div>
        <button id="confirmarPago">Confirmar pago</button>
      </div>

      <!-- MENSAJE DE ÉXITO -->
      <div class="exito" id="reservaExitosa">
        🎉 ¡Reserva exitosa!  
        <br><br>Tu reserva ha sido registrada correctamente en el sistema.
        <div class="botones-exito">
          <button id="verFactura">Ver factura</button>
          <button id="volverInicio">Volver al inicio</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Configurar fechas mínimas
    const fechaIngreso = document.getElementById("fecha_ingreso");
    const fechaSalida = document.getElementById("fecha_salida");
    const hoy = new Date();
    hoy.setDate(hoy.getDate() + 7);
    fechaIngreso.min = hoy.toISOString().split("T")[0];
    fechaIngreso.addEventListener("change", () => {
      fechaSalida.min = fechaIngreso.value;
    });

    const form = document.getElementById("formReserva");
    const resumen = document.getElementById("resumenReserva");
    const tablaResumen = document.getElementById("tablaResumen");
    const totalPagar = document.getElementById("totalPagar");
    const exito = document.getElementById("reservaExitosa");

    let datosReserva = {};

    form.addEventListener("submit", (e) => {
      e.preventDefault();

      const data = Object.fromEntries(new FormData(form));
      datosReserva = data;

      // Fechas y horas
      const fechaIn = new Date(data.fecha_ingreso);
      const fechaOut = new Date(data.fecha_salida);
      const horaIn = data.hora_ingreso === "8:00 AM" ? 8 : 17;
      const horaOut = data.hora_salida === "8:00 AM" ? 8 : 17;
      fechaIn.setHours(horaIn);
      fechaOut.setHours(horaOut);

      const diffHoras = (fechaOut - fechaIn) / (1000 * 60 * 60);
      const diasCompletos = Math.floor(diffHoras / 24);
      const horasRestantes = diffHoras % 24;

      // Calcular valor por persona
      let valorPorPersona = 0;
      if (diffHoras <= 24) {
        valorPorPersona = 80000;
      } else {
        valorPorPersona = (diasCompletos * 80000) + (horasRestantes > 0 ? 120000 : 0);
      }

      const aseo = 150000;
      const deposito = 500000;
      const subtotal = valorPorPersona * data.personas_mayores;
      const total = subtotal + aseo + deposito;

      tablaResumen.innerHTML = `
        <tr><td>Cliente:</td><td>${data.nombre}</td></tr>
        <tr><td>Cédula:</td><td>${data.cedula}</td></tr>
        <tr><td>Correo:</td><td>${data.correo}</td></tr>
        <tr><td>Ingreso:</td><td>${data.fecha_ingreso} - ${data.hora_ingreso}</td></tr>
        <tr><td>Salida:</td><td>${data.fecha_salida} - ${data.hora_salida}</td></tr>
        <tr><td>Duración:</td><td>${diffHoras.toFixed(1)} horas (${diasCompletos} días)</td></tr>
        <tr><td>Personas:</td><td>${data.personas_mayores}</td></tr>
        <tr><td>Valor por persona:</td><td>$${valorPorPersona.toLocaleString("es-CO")}</td></tr>
        <tr><td>Subtotal:</td><td>$${subtotal.toLocaleString("es-CO")}</td></tr>
        <tr><td>Aseo:</td><td>$${aseo.toLocaleString("es-CO")}</td></tr>
        <tr><td>Depósito:</td><td>$${deposito.toLocaleString("es-CO")}</td></tr>
      `;
      totalPagar.innerHTML = `TOTAL A PAGAR: $${total.toLocaleString("es-CO")}`;

      datosReserva = {
        ...data,
        valorPorPersona,
        subtotal,
        total,
        duracionHoras: diffHoras,
        fechaReserva: new Date().toLocaleString()
      };

      form.style.display = "none";
      resumen.style.display = "block";
    });

    document.getElementById("confirmarPago").addEventListener("click", () => {
      const reservas = JSON.parse(localStorage.getItem("reservas")) || [];
      reservas.push(datosReserva);
      localStorage.setItem("reservas", JSON.stringify(reservas));

      resumen.style.display = "none";
      exito.style.display = "block";
    });

    // Ver factura
    document.getElementById("verFactura").addEventListener("click", () => {
      localStorage.setItem("facturaActual", JSON.stringify(datosReserva));
      window.location.href = "/factura";
    });

    // Volver al inicio
    document.getElementById("volverInicio").addEventListener("click", () => {
      window.location.href = "/";
    });
  </script>
