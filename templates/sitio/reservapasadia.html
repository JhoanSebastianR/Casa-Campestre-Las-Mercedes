{% include 'sitio/cabecera.html' %}

<div class="reserva-page">
  <div class="container">
    <h2>Reserva tu pasadía</h2>

    <!-- FORMULARIO -->
    <form id="formReserva" method="post" enctype="multipart/form-data">
      <label>Nombre:</label>
      <input type="text" name="nombre_cliente" required />

      <label>Apellido:</label>
      <input type="text" name="apellido_cliente" required />

      <label>Cédula:</label>
      <input type="text" name="id_cliente" required />

      <label>Correo electrónico:</label>
      <input type="email" name="correo_cliente" required />

      <label>Teléfono:</label>
      <input type="tel" name="telefono_cliente" required />

      <label>Dirección:</label>
      <input type="text" name="direccion_cliente" required />

      <label>Fecha del pasadía:</label>
      <input type="date" name="fecha_pasadia" id="fecha_pasadia" required />

      <label>Tipo de pasadía:</label>
      <select name="tipo_pasadia" id="tipo_pasadia" required>
        <option value="">Selecciona el tipo de pasadía</option>
        <option value="Publico">Público</option>
        <option value="Privado">Privado</option>
      </select>

      <label>Horario del pasadía:</label>
      <select name="horario_pasadia" id="horario_pasadia" required>
        <option value="">Selecciona el horario</option>
        <option value="Diurno">Diurno</option>
        <option value="Nocturno">Nocturno</option>
      </select>

      <label>Número de personas:</label>
      <input type="number" name="cantidad" id="cantidad" min="1" required />

      <!-- Campo oculto para el total -->
      <input type="hidden" name="total" id="inputTotal" />

      <button type="button" id="btnContinuar">Continuar</button>
    </form>

    <!-- RESUMEN -->
    <div class="resumen" id="resumenReserva" style="display:none;">
      <h3>Confirma tu reserva</h3>
      <table id="tablaResumen"></table>
      <div class="total" id="totalPagar"></div>
      <button id="confirmarPago">Confirmar pago</button>
    </div>
  </div>
</div>

<script>
  // Configurar fecha mínima (hoy)
  const fechaIngreso = document.getElementById("fecha_pasadia");
  const hoy = new Date();
  fechaIngreso.min = hoy.toISOString().split("T")[0];

  const form = document.getElementById("formReserva");
  const btnContinuar = document.getElementById("btnContinuar");
  const resumen = document.getElementById("resumenReserva");
  const tablaResumen = document.getElementById("tablaResumen");
  const totalPagar = document.getElementById("totalPagar");
  const inputTotal = document.getElementById("inputTotal");

  let datosReserva = {};

  btnContinuar.addEventListener("click", () => {
    const data = Object.fromEntries(new FormData(form));
    datosReserva = data;

    const tipo = data.tipo_pasadia;
    const horario = data.horario_pasadia;
    const personas = parseInt(data.cantidad);

    let total = 0;
    let valorPorPersona = 0;

    // ---- Lógica de cobro ----
    if (tipo === "Publico") {
      if (horario === "Diurno") valorPorPersona = 25000;
      if (horario === "Nocturno") valorPorPersona = 30000;

      // Si son exactamente 2 personas (combo)
      if (personas === 2) {
        total = 100000;
      } else {
        total = valorPorPersona * personas;
      }
    } else if (tipo === "Privado") {
      valorPorPersona = 50000;
      total = valorPorPersona * personas;
    }

    // Guardar total
    inputTotal.value = total;
    datosReserva.total = total;
    datosReserva.valorPorPersona = valorPorPersona;

    // Mostrar resumen
    tablaResumen.innerHTML = `
      <tr><td>Cliente:</td><td>${data.nombre_cliente} ${data.apellido_cliente}</td></tr>
      <tr><td>Cédula:</td><td>${data.id_cliente}</td></tr>
      <tr><td>Correo:</td><td>${data.correo_cliente}</td></tr>
      <tr><td>Teléfono:</td><td>${data.telefono_cliente}</td></tr>
      <tr><td>Dirección:</td><td>${data.direccion_cliente}</td></tr>
      <tr><td>Fecha del pasadía:</td><td>${data.fecha_pasadia}</td></tr>
      <tr><td>Tipo:</td><td>${data.tipo_pasadia}</td></tr>
      <tr><td>Horario:</td><td>${data.horario_pasadia}</td></tr>
      <tr><td>Personas:</td><td>${personas}</td></tr>
      <tr><td>Valor por persona:</td><td>$${valorPorPersona.toLocaleString("es-CO")}</td></tr>
    `;

    totalPagar.innerHTML = `<strong>TOTAL A PAGAR:</strong> $${total.toLocaleString("es-CO")}`;

    // Mostrar resumen y ocultar formulario
    form.style.display = "none";
    resumen.style.display = "block";
  });

  // === Enviar datos al backend cuando se confirma el pago ===
  document.getElementById("confirmarPago").addEventListener("click", async () => {
    const formData = new FormData();
    for (const key in datosReserva) {
      formData.append(key, datosReserva[key]);
    }

    try {
      const response = await fetch("/reservapasadia/guardar", {
        method: "POST",
        body: formData
      });

      if (response.ok) {
        window.location.href = "/reserva_exitosa_pasadia";
      } else {
        alert("❌ Error al guardar la reserva. Inténtalo de nuevo.");
      }
    } catch (error) {
      console.error("Error de conexión:", error);
      alert("No se pudo conectar al servidor.");
    }
  });
</script>
